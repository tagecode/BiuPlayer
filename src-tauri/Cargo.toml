[workspace]
members = ["crates/*"]
resolver = "2"

[package]
name = "biuplayer"
version = "0.1.0"
description = "BiuPlayer — 博音音乐播放器"
authors = ["BiuPlayer Contributors"]
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "biuplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
biu-core = { path = "crates/biu-core" }
biu-audio = { path = "crates/biu-audio" }
biu-library = { path = "crates/biu-library" }
biu-ipc = { path = "crates/biu-ipc" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta-typescript = "=0.0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

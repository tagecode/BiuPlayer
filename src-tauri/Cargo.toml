[workspace]
members = ["crates/*"]
resolver = "2"

[package]
name = "biuplayer"
version = "0.1.0"
description = "BiuPlayer — 博音音乐播放器"
authors = ["BiuPlayer Contributors"]
edition = "2021"
license = "MIT"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "biuplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
biu-core = { path = "crates/biu-core" }
biu-audio = { path = "crates/biu-audio" }
biu-library = { path = "crates/biu-library" }
biu-lyrics = { path = "crates/biu-lyrics" }
biu-ipc = { path = "crates/biu-ipc" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta-typescript = "=0.0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"

[dev-dependencies]
lofty = "0.22"
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[package]
name = "biu-library"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "BiuPlayer SQLite schema and scanner spike"

[dependencies]
biu-core = { path = "../biu-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
lofty = "0.22"
pinyin = "0.10"

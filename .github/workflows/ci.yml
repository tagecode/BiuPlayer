name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            xvfb

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Version consistency
        run: pnpm check:version

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Frontend unit tests with coverage
        run: pnpm test:coverage

      - name: TypeScript build
        run: pnpm build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        shell: bash
        run: cargo test --workspace

      - name: Tauri compile smoke
        run: pnpm tauri build --no-bundle

      - name: Linux runtime smoke
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          GDK_BACKEND: "x11"
          RUST_LOG: "info"
        run: |
          set +e
          timeout --signal=TERM --kill-after=5 45s \
            xvfb-run -a src-tauri/target/release/biuplayer
          code=$?
          set -e
          # A GUI app is expected to keep running until timeout kills it.
          if [ "$code" -ne 124 ]; then
            echo "unexpected exit code: $code"
            exit 1
          fi
          log=$(ls "$HOME"/.local/share/biuplayer/logs/biu.log.* 2>/dev/null | tail -1 || true)
          if [ -z "$log" ]; then
            echo "no application log found; home contents:"
            find "$HOME/.local/share" -maxdepth 3 -type f 2>/dev/null | head -20
            exit 1
          fi
          grep -q "logging initialized" "$log"
          echo "runtime smoke ok: $log"

  e2e:
    name: e2e (browser mock, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium

      - name: Browser E2E
        run: pnpm test:e2e

  coverage:
    name: rust coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Rust line coverage
        working-directory: src-tauri
        # The Tauri app crate is excluded: instrumented app tests hang on the
        # headless runner (no WebView2), so only the libraries are measured.
        run: cargo llvm-cov -p biu-core -p biu-audio -p biu-library -p biu-lyrics --summary-only --fail-under-lines 45

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: src-tauri/target/llvm-cov/html
          if-no-files-found: ignore

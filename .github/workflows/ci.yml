name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            xvfb

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: TypeScript build
        run: pnpm build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        shell: bash
        run: |
          # The Tauri app test binary imports WebView2Loader.dll from its own
          # directory on Windows; GitHub runners cannot resolve it from
          # target/debug/deps. The app crate is still covered by the Tauri
          # compile smoke below, so skip only its tests on Windows.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo test --workspace --exclude biuplayer
          else
            cargo test --workspace
          fi

      - name: Tauri compile smoke
        run: pnpm tauri build --no-bundle

      - name: Linux runtime smoke
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          GDK_BACKEND: "x11"
          RUST_LOG: "info"
        run: |
          set +e
          timeout --signal=TERM --kill-after=5 45s \
            xvfb-run -a src-tauri/target/release/biuplayer
          code=$?
          set -e
          # A GUI app is expected to keep running until timeout kills it.
          if [ "$code" -ne 124 ]; then
            echo "unexpected exit code: $code"
            exit 1
          fi
          log=$(ls "$HOME"/.local/share/biuplayer/logs/biu.log.* 2>/dev/null | tail -1 || true)
          if [ -z "$log" ]; then
            echo "no application log found; home contents:"
            find "$HOME/.local/share" -maxdepth 3 -type f 2>/dev/null | head -20
            exit 1
          fi
          grep -q "logging initialized" "$log"
          echo "runtime smoke ok: $log"

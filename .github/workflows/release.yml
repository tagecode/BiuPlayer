name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            name: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            name: windows-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            name: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libfuse2 \
            rpm

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Build bundles
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Package portable zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $out = "src-tauri/target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path "$out/portable" | Out-Null
          Copy-Item "$out/biuplayer.exe" "$out/portable/"
          if (Test-Path "$out/WebView2Loader.dll") {
            Copy-Item "$out/WebView2Loader.dll" "$out/portable/"
          }
          New-Item -ItemType Directory -Force -Path "$out/bundle" | Out-Null
          Compress-Archive -Path "$out/portable/*" -DestinationPath "$out/bundle/BiuPlayer_0.1.0_x64-portable.zip"

      - name: List bundles
        shell: bash
        run: find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f -maxdepth 4 -print 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: biuplayer-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/BiuPlayer_0.1.0_x64-portable.zip

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: biuplayer-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          find . -type f -printf '%P\n' | sort | while read -r file; do
            sha256sum "$file"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/SHA256SUMS.txt
          retention-days: 14

  release:
    name: draft release
    needs: [build, checksums]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: biuplayer-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: checksums
          path: artifacts

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          name: BiuPlayer ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt

name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            name: linux-x64
            platform: linux
            arch: x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            name: windows-x64
            platform: windows
            arch: x64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            name: macos-x64
            platform: macos
            arch: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            name: macos-arm64
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libfuse2 \
            rpm

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Build bundles
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Package portable zip (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $out = "src-tauri/target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path "$out/portable" | Out-Null
          Copy-Item "$out/biuplayer.exe" "$out/portable/"
          New-Item -ItemType File -Force -Path "$out/portable/portable.flag" | Out-Null
          if (Test-Path "$out/WebView2Loader.dll") {
            Copy-Item "$out/WebView2Loader.dll" "$out/portable/"
          }
          if (-not (Test-Path "$out/portable/portable.flag")) {
            throw "portable.flag missing"
          }
          New-Item -ItemType Directory -Force -Path "$out/bundle/named" | Out-Null
          Compress-Archive -Path "$out/portable/*" `
            -DestinationPath "$out/bundle/named/BiuPlayer_${version}_windows_x64-portable.zip"

      - name: Normalize bundle names
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          platform="${{ matrix.platform }}"
          arch="${{ matrix.arch }}"
          out="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p "$out/named"
          case "${platform}-${arch}" in
            windows-x64)
              cp "$out/nsis/"*.exe "$out/named/BiuPlayer_${version}_windows_x64-setup.exe"
              ;;
            macos-x64|macos-arm64)
              cp "$out/dmg/"*.dmg "$out/named/BiuPlayer_${version}_${platform}_${arch}.dmg"
              ;;
            linux-x64)
              cp "$out/appimage/"*.AppImage "$out/named/BiuPlayer_${version}_linux_x64.AppImage"
              cp "$out/deb/"*.deb "$out/named/BiuPlayer_${version}_linux_x64.deb"
              cp "$out/rpm/"*.rpm "$out/named/BiuPlayer_${version}_linux_x64.rpm"
              ;;
            *)
              echo "unsupported platform/arch: ${platform}-${arch}" >&2
              exit 1
              ;;
          esac
          ls -la "$out/named"

      - name: List bundles
        shell: bash
        run: find "src-tauri/target/${{ matrix.target }}/release/bundle/named" -type f -maxdepth 1 -print

      - uses: actions/upload-artifact@v4
        with:
          name: biuplayer-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: src-tauri/target/${{ matrix.target }}/release/bundle/named/*

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: biuplayer-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: release/SHA256SUMS.txt
          retention-days: 14

  release:
    name: draft release
    needs: [build, checksums]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: biuplayer-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: checksums
          path: checksums

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cp checksums/SHA256SUMS.txt release/

      - name: Extract changelog section
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="${version}" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "CHANGELOG.md has no section for ${version}; refusing to publish empty notes" >&2
            exit 1
          fi
          cat release-body.md

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: BiuPlayer ${{ github.ref_name }}
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: release/*
